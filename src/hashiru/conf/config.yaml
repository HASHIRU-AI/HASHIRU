# HASHIRU v2 settings. Override any key on the command line (key=value) or through the
# environment variable named in its default. Models are LiteLLM strings: ollama_chat/... and
# ollama/... are local (they cost memory), anything else is cloud (it costs money).
ceo_model: ${oc.env:CEO_MODEL,'ollama_chat/qwen3.5:4b'}
models: ${oc.env:MODELS,'ollama_chat/qwen3.5:4b'}  # comma-separated, or a YAML list
budget_usd: ${oc.decode:${oc.env:BUDGET_USD,'0.50'}}  # the CEO's pool for one session
max_usd: ${oc.decode:${oc.env:MAX_USD,'2.00'}}        # hard cap on real API spend per process
max_depth: 2                                          # levels of agents below the CEO
max_turns: 12                                         # LLM turns per manager run before it replies "failed"
task_timeout: 1800                                    # seconds for one user request, across every agent it reaches
ollama_url: ${oc.env:OLLAMA_URL,'http://127.0.0.1:11434'}
ollama_num_ctx: ${oc.decode:${oc.env:OLLAMA_NUM_CTX,'16384'}}  # local models' context window, in tokens. Ollama's
                                      # default (4096) fills up after a few tool results, leaving no room to answer;
                                      # larger windows take more memory (qwen3.5:4b: 3.0 GB at 4096, 3.5 GB at 16384)
host: 127.0.0.1
port: ${oc.decode:${oc.env:PORT,'9200'}}  # 9100 is HASHIRU-lite's
data_dir: data          # read_file is limited to this directory; memory.json seeds the memory tool
trace_dir: traces       # one JSONL trace per session
prices_file: ${oc.env:HASHIRU_PRICES,''}  # LiteLLM price entries for cloud models its map lacks
# Tool creation: managers may write new tools (Python code that runs on this machine in its own uv
# environment, without API keys but with access to the user's files). Off unless you trust the agents.
tool_creation: ${oc.decode:${oc.env:HASHIRU_TOOL_CREATION,'false'}}
tools_dir: user_tools      # created tools and their manifest; reloaded when the hub starts
tool_start_timeout: 180    # seconds to install a new tool's dependencies and start it
tool_call_timeout: 60      # seconds one call to a created tool may take
# Third-party MCP servers, offered to agents as <server>__<tool>. Usually set in your own config file
# (HASHIRU_CONFIG=my.yaml or --config my.yaml); see examples/hashiru.yaml.
#   name: {command: uvx, args: [mcp-server-fetch], env: {KEY: value}, labels: [untrusted]}
#   name: {command: ..., labels: [private], egress: false}   # egress: false = it never sends data off the machine;
#                                                            # one that stores data should also be labeled private
#   name: {url: https://example.com/mcp, headers: {Authorization: Bearer ...}}
mcp_servers: {}
memory_db: ${data_dir}/memory.sqlite3  # shared, persistent memory; '' gives each session its own copy of memory.json
memory_autoinject: false               # add relevant saved memories to each user message to the CEO
mcp_start_timeout: 30                  # seconds to connect to each configured MCP server (they start in parallel)
# Budgets and modes (v1's Mode switches). With enforce_budget, hires cannot reserve more than the hirer has
# left, a local model must fit in free memory, and an agent whose pool is spent stops making cloud calls.
# false keeps accounting only, so policy experiments can watch agents overspend.
enforce_budget: true
allow_hiring: true
allow_local_agents: true
allow_cloud_agents: true      # cloud models and remote A2A peers
# Remote A2A agents managers may hire as a2a/<name> (always workers, always billed in dollars).
#   name: {url: https://example.com/agent/, headers: {Authorization: Bearer ...}, price_usd_per_message: 0.01}
a2a_peers: {}
# Hiring by difficulty: a hiring agent says how hard a job is (easy, medium, hard) and the hub picks the model. Each
# difficulty lists models to try, best first; one it does not list is ordered from models: easy tries small local
# models, then cheap cloud ones; medium large local, then cheap cloud; hard the dearest cloud, then large local.
#   routing: {hard: [gpt-4.1, ollama_chat/gemma4:12b]}
routing: {}
max_escalations: 2            # a worker that fails or answers empty moves up its list this many times per message
turn_reserve_usd: 0.01        # with enforce_budget, a cloud manager keeps this much for its own turns when it hires
# Approvals before a big spend: the turn pauses, the reply asks, and the user's next message decides ("approve"
# allows it once; anything else denies it). 0 never asks. Sessions nobody can answer (`hashiru ask` in a script) deny.
approve_hire_usd: 0.25        # a hire reserving this much or more for a cloud model or a remote agent
approve_hire_mb: 16384        # a hire or an escalation that loads a local model this big (MB) that is not loaded
approve_turn_usd: 0.25        # a turn that has spent this much (and each further step) before its next cloud call
# Serving (`hashiru serve`): a chat page at /, an OpenAI-compatible API at /v1, the CEO as an A2A agent at /a2a
# (card at /.well-known/agent-card.json and /a2a/.well-known/agent-card.json) and HASHIRU as an MCP server
# (/public/mcp), all on one port.
api_key: ${oc.env:HASHIRU_API_KEY,''}        # clients send it as a bearer token; required unless host is loopback
public_url: ${oc.env:HASHIRU_PUBLIC_URL,''}  # where others reach this hub (the Agent Card names it)
max_sessions: 16              # open conversations; when full, the least recently used idle one is closed
session_ttl: 3600             # seconds an idle conversation (and everyone it hired) stays open
frame_ancestors: ${oc.env:HASHIRU_FRAME_ANCESTORS,"'none'"}  # who may embed the chat page in a frame
# Private data (R3, private stays local): results of read_file and memory, recalled memories, servers labeled
# private, and everything the user says in a private chat reach only local models and the user. A chat becomes
# private when the client asks (chat page lock, x-hashiru-private header, A2A metadata hashiru_private, MCP ask
# private=true) and stays private; its CEO moves to private_ceo_model.
private_ceo_model: ${oc.env:HASHIRU_PRIVATE_CEO_MODEL,''}  # default: ceo_model if local, else the first local model
private_egress: block            # block (or any value but allow): agents holding private data cannot call tools
                                 # that leave the machine. R3 does not hold with tool_creation on (see README)
private_by_default: ${oc.decode:${oc.env:HASHIRU_PRIVATE_BY_DEFAULT,'false'}}  # every chat private
# How private data reaches cloud models. obfuscate: names, contact details, numbers and secrets become placeholders
# (⟦PERSON_1⟧) and amounts, dates, ages and health details vague descriptions, restored when replies come back;
# found by Presidio's patterns and a local model. block: cloud models never see it (a private chat's CEO moves to
# private_ceo_model). If obfuscation cannot run (no local model for the detector) or misses, it blocks instead.
private_mode: ${oc.env:HASHIRU_PRIVATE_MODE,obfuscate}
obfuscate_with: patterns+model     # or patterns: Presidio only (no model call, but names are not found)
obfuscate_model: ''                # local model for the detector; default as private_ceo_model
