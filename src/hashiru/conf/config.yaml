# HASHIRU v2 settings. Override any key on the command line (key=value) or through the
# environment variable named in its default. Models are LiteLLM strings: ollama_chat/... and
# ollama/... are local (they cost memory), anything else is cloud (it costs money).
ceo_model: ${oc.env:CEO_MODEL,'ollama_chat/qwen3.5:4b'}
models: ${oc.env:MODELS,'ollama_chat/qwen3.5:4b'}  # comma-separated, or a YAML list
budget_usd: ${oc.decode:${oc.env:BUDGET_USD,'0.50'}}  # the CEO's pool for one session
max_usd: ${oc.decode:${oc.env:MAX_USD,'2.00'}}        # hard cap on real API spend per process
max_depth: 2                                          # levels of agents below the CEO
max_turns: 12                                         # LLM turns per manager run before it replies "failed"
a2a_timeout: 600                                      # seconds a depth-2 agent may take; shallower hops get more
ollama_url: ${oc.env:OLLAMA_URL,'http://127.0.0.1:11434'}
host: 127.0.0.1
port: ${oc.decode:${oc.env:PORT,'9100'}}
data_dir: data          # read_file is limited to this directory; memory.json seeds the memory tool
trace_dir: traces       # one JSONL trace per session
prices_file: ${oc.env:HASHIRU_PRICES,''}  # LiteLLM price entries for cloud models its map lacks
# Tool creation: managers may write new tools (Python code that runs on this machine in its own uv
# environment, without API keys but with access to the user's files). Off unless you trust the agents.
tool_creation: ${oc.decode:${oc.env:HASHIRU_TOOL_CREATION,'false'}}
tools_dir: user_tools      # created tools and their manifest; reloaded when the hub starts
tool_start_timeout: 180    # seconds to install a new tool's dependencies and start it
tool_call_timeout: 60      # seconds one call to a created tool may take
# Third-party MCP servers, offered to agents as <server>__<tool>. Usually set in your own config file
# (HASHIRU_CONFIG=my.yaml or --config my.yaml); see examples/hashiru.yaml.
#   name: {command: uvx, args: [mcp-server-fetch], env: {KEY: value}, labels: [untrusted]}
#   name: {url: https://example.com/mcp, headers: {Authorization: Bearer ...}}
mcp_servers: {}
memory_db: ${data_dir}/memory.sqlite3  # shared, persistent memory; '' gives each session its own copy of memory.json
memory_autoinject: false               # add relevant saved memories to each user message to the CEO
mcp_start_timeout: 30                  # seconds to connect to each configured MCP server (they start in parallel)
