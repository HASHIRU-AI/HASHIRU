[project]
name = "hashiru"
version = "2.0.0.dev0"
description = "HASHIRU v2: hierarchical, budget-aware multi-agent system on MCP (tools) and A2A (agents)"
readme = "README.md"
requires-python = ">=3.13"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Kunal Pai" },
    { name = "Parth Shah" },
    { name = "Harshil Patel" },
]
dependencies = [
    "mcp==2.2.0",
    "a2a-sdk[http-server]==1.2.2",
    # Exact pin: malicious LiteLLM releases reached PyPI in early 2026. Check advisories before bumping.
    "litellm==1.103.4",
    "hydra-core==1.3.8",
    "packaging",
    "httpx",
    "psutil",
    "starlette",
    "uvicorn",
    "presidio-analyzer==2.2.366",
    # Runs approved plans (plangraph.py). Exact pin, like litellm; its langsmith dependency is kept from tracing.
    "langgraph==1.2.15",
]

[project.scripts]
hashiru = "hashiru.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "openai"]  # openai: the API compatibility tests use the official client

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hashiru"]

[tool.hatch.build.targets.sdist]
include = ["src/hashiru"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
include = ["src/hashiru/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["src/hashiru", "examples"]
ignore_missing_imports = true
check_untyped_defs = true
